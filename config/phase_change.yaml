# ADR-0019: when any versioned artifact changes (prompt, risk_policy, scanner, qb_rules, exclusions, fees, model IDs,
# migrations, worker code), the owner records the justification here in the same commit. Boot compares the versions in
# force with the open experiment phase; on drift it opens a new phase only if this record is FRESH: `sequence` must equal
# the open phase's seq + 1, `reason` non-empty, `category` in strategy | correctness | safety, and `for_versions` must
# name the new value of every drifted version key. Otherwise boot halts with PHASE_REASON_MISSING.
schema_version: 2
sequence: 1                   # the phase this record justifies; bump on every change
category: initial             # initial | strategy | correctness | safety
reason: "Initial phase (Phase 0 package, owner review round 1)."
for_versions:                 # new values for keys that changed; ignored for the initial phase
  prompt_version: null
  config_version: null
  scanner_version: null
  qb_rules_version: null
  exclusion_list_version: null
